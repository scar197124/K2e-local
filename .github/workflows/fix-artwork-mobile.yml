name: Fix RC45 artwork and mobile layout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Apply RC45 artwork and mobile fix') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch artwork references and mobile layout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.html')
          s=p.read_text()
          s=s.replace("./assets/k2e-local-home-visual-locked-dark.png","./assets/k2e-local-home-visual-locked-dark.webp")
          s=s.replace("./assets/k2e-local-home-visual-locked-light.png","./assets/k2e-local-home-visual-locked-light.webp")
          old='@media(max-width:760px){.app{padding:10px}.topbar{padding:12px;border-radius:18px;position:static}.brand-block{flex-direction:column;align-items:flex-start;gap:8px}.brand-logo{width:min(220px,70vw)}.overview-grid{margin-top:14px}.welcome-panel,.surface-card,.workspace-shell{padding:18px}.welcome-panel h1{font-size:40px}.welcome-panel p{font-size:16px}.visual-panel{padding:12px}.visual-note{grid-template-columns:1fr}.steps{grid-template-columns:1fr}.choice-grid,.form-cluster,.estimate-metrics,.estimate-facts,.picker-grid,.tools-nav-row{grid-template-columns:1fr}.rate-meta{flex-direction:column;align-items:flex-start}.advanced-nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.add-device-action{width:100%}.floating-device-picker{left:0;right:0;width:auto;max-height:360px}.workspace-shell{padding:16px}.scroll-body,.scroll-body.tall{padding:16px}.workspace-card>header{padding:16px}}'
          new='@media(max-width:760px){.app{padding:8px 8px 18px}.topbar{padding:9px 10px;border-radius:16px;position:static;gap:8px}.brand-block{flex-direction:row;align-items:center;gap:9px}.brand-logo{width:min(176px,52vw)}.brand-copy{display:none}.topbar-right{gap:7px;justify-content:flex-end}.status-pill,#shellClock{display:none}.topbar .ghost,.topbar .danger{padding:8px 10px;min-height:40px}.overview-grid{margin:10px 0 12px;gap:12px}.welcome-panel,.surface-card,.workspace-shell{padding:16px;border-radius:20px}.welcome-panel h1{font-size:clamp(34px,10vw,44px);line-height:1}.welcome-panel p{font-size:15px;line-height:1.5}.onboard-pills{gap:7px;margin-top:16px}.onboard-pills span{padding:7px 9px;font-size:11px}.visual-panel{padding:8px;border-radius:20px;grid-template-rows:auto auto}.visual-stage{min-height:0;aspect-ratio:4/3;border-radius:16px;background-size:contain;background-position:center}.visual-note{grid-template-columns:1fr;gap:8px}.note-card{padding:11px 12px;border-radius:14px}.steps{grid-template-columns:1fr;gap:8px;margin-bottom:12px}.step{padding:12px 14px}.choice-grid,.form-cluster,.estimate-metrics,.estimate-facts,.picker-grid,.tools-nav-row{grid-template-columns:1fr}.choice{min-height:96px;padding:15px}.rate-row{flex-direction:column}.rate-meta{flex-direction:column;align-items:flex-start}.section-head{flex-direction:column;gap:8px}.section-badge{white-space:normal}.estimate-panel{top:auto}.advanced-nav{display:flex;overflow-x:auto;gap:8px;padding-bottom:4px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}.advanced-nav button{flex:0 0 auto;min-width:118px;scroll-snap-align:start}.add-device-action{width:100%}.floating-device-picker{left:0;right:0;width:auto;max-height:360px}.workspace-shell{padding:14px}.scroll-body,.scroll-body.tall{padding:14px}.workspace-card>header{padding:14px}.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}}'
          if old not in s:
              raise SystemExit('Expected RC45 mobile block not found')
          s=s.replace(old,new)
          p.write_text(s)
          PY
          rm -f .github/workflows/fix-artwork-mobile.yml
          node scripts/validate-release.mjs
          node scripts/validate-full-wiring.mjs
          find . -type f ! -name 'SHA256SUMS.txt' ! -path './.git/*' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "scar197124"
          git config user.email "spartica1791@gmail.com"
          git add -A
          git commit -m "Apply RC45 artwork and mobile fix"
          git push origin HEAD:main
