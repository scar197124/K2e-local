name: Final RC45 polish

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final polish
        run: python3 scripts/apply-final-polish.py

      - name: Validate clean release
        run: |
          set -euo pipefail
          rm -f .github/workflows/final-rc45-polish.yml scripts/apply-final-polish.py
          node scripts/validate-release.mjs
          node scripts/validate-full-wiring.mjs
          find . -type f ! -name 'SHA256SUMS.txt' ! -path './.git/*' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Commit final locked polish
        run: |
          set -euo pipefail
          git config user.name 'scar197124'
          git config user.email 'spartica1791@gmail.com'
          git add -A
          git commit -m 'Lock RC45 final UI polish'
          git push origin HEAD:main
