name: Assemble RC45 staging payload

on:
  push:
    branches: [chatgpt-rc45-upload]

permissions:
  contents: write

jobs:
  assemble:
    if: ${{ !contains(github.event.head_commit.message, 'Finalize RC45 full-system wired build') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-rc45-upload
          fetch-depth: 0
      - name: Assemble and validate final RC45 app
        shell: bash
        run: |
          set -euo pipefail
          : > app.html
          for f in .release-gz/part.*.b64; do
            base64 -d "$f" | gzip -dc >> app.html
          done
          test "$(wc -c < app.html)" -eq 87018
          rm -rf .release .release-parts .release-gz
          rm -f .github/workflows/assemble-rc45.yml
          node scripts/validate-release.mjs
          node scripts/validate-full-wiring.mjs
          find . -type f ! -name 'SHA256SUMS.txt' ! -path './.git/*' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Commit final RC45 staging build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "scar197124"
          git config user.email "spartica1791@gmail.com"
          git add -A
          git commit -m "Finalize RC45 full-system wired build"
          git push origin HEAD:chatgpt-rc45-upload
