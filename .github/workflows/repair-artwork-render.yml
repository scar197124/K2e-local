name: Restore artwork and compact portrait flow

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.event.head_commit.message == 'Restore artwork and compact portrait flow' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore valid artwork assets
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageEnhance
          src='assets/k2e-local-home-visual-restored.webp'
          im=Image.open(src).convert('RGB')
          im.load()
          im.save('assets/k2e-local-home-visual-live-dark.png', format='PNG', optimize=True)
          light=ImageEnhance.Brightness(im).enhance(1.08)
          light.save('assets/k2e-local-home-visual-live-light.png', format='PNG', optimize=True)
          Image.open('assets/k2e-local-home-visual-live-dark.png').verify()
          Image.open('assets/k2e-local-home-visual-live-light.png').verify()
          PY
          test -s assets/k2e-local-home-visual-live-dark.png
          test -s assets/k2e-local-home-visual-live-light.png

      - name: Apply artwork and portrait cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          dark="./assets/k2e-local-home-visual-live-dark.png?v=rc45-art5"
          light="./assets/k2e-local-home-visual-live-light.png?v=rc45-art5"

          p=Path('index.html')
          s=p.read_text()
          for old in [
              "background-image:url('./assets/k2e-local-home-visual-restored.webp')",
              "background-image:url('./assets/k2e-local-home-visual-locked-dark.webp')",
              "background-image:url('./assets/k2e-local-home-visual-locked-light.webp')"
          ]:
              if old in s:
                  # handled explicitly below where possible
                  pass
          restored="background-image:url('./assets/k2e-local-home-visual-restored.webp')"
          if s.count(restored)>=2:
              s=s.replace(restored, f"background-image:url('{dark}')",1)
              s=s.replace(restored, f"background-image:url('{light}')",1)
          s=s.replace('min-height:610px;overflow:hidden','min-height:540px;overflow:hidden',1)
          s=s.replace('.hero-visual{position:relative;min-height:610px;','.hero-visual{position:relative;min-height:540px;',1)
          s=s.replace('h1{margin:0;max-width:650px;font-size:clamp(48px,5.2vw,78px)','h1{margin:0;max-width:650px;font-size:clamp(44px,4.7vw,68px)',1)
          p.write_text(s)

          p=Path('app.html')
          s=p.read_text()
          restored="background-image:url('./assets/k2e-local-home-visual-restored.webp')"
          if s.count(restored)>=2:
              s=s.replace(restored, f"background-image:url('{dark}')",1)
              s=s.replace(restored, f"background-image:url('{light}')",1)
          s=s.replace('aspect-ratio:728/710','aspect-ratio:4/3')
          s=s.replace('.overview-grid{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(330px,.88fr);gap:18px;margin:18px 0}', '.overview-grid{display:grid;grid-template-columns:minmax(0,1.18fr) minmax(320px,.82fr);gap:18px;margin:18px 0}')
          notes='''    <div class="visual-note">\n      <div class="note-card"><span>Setup flow</span><strong>Tell us about your home</strong><p>Keep the same low-friction entry point before going deeper into devices and reports.</p></div>\n      <div class="note-card"><span>Inside look</span><strong>Same product, better shell</strong><p>The internal UI now carries the same confidence as the front door, instead of feeling like an older app underneath.</p></div>\n    </div>'''
          s=s.replace(notes,'',1)
          s=s.replace('<div class="step active" data-step="1"><b>1</b><span>Tell us about your home</span></div>', '<div class="step active" data-step="1"><b>1</b><span>Setup</span></div>',1)
          s=s.replace('<div class="step" data-step="2"><b>2</b><span>See your estimate</span></div>', '<div class="step" data-step="2"><b>2</b><span>Estimate</span></div>',1)
          css='''\n/* RC45 portrait compactness + copy cleanup */\n.visual-panel{display:block}\n.visual-note{display:none!important}\n.steps{margin-bottom:12px}\n.step{padding:10px 14px}\n.step b{width:32px;height:32px;border-radius:11px}\n@media(max-width:760px){\n  .app{padding:6px 8px 18px}\n  .topbar{display:flex;grid-template-columns:none;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:14px;position:sticky;top:4px}\n  .brand-block{flex:1 1 auto;min-width:0;gap:0}\n  .brand-logo{width:min(168px,56vw);max-width:168px}\n  .brand-copy,.status-pill,#shellClock{display:none!important}\n  .topbar-right{display:flex;align-items:center;justify-content:flex-end;flex:0 0 auto;gap:6px;flex-wrap:nowrap}\n  #themeBtn{min-height:34px;padding:6px 9px;border-radius:10px;font-size:11px;white-space:nowrap}\n  #globalReset{min-height:34px;padding:6px 8px;border-radius:10px;font-size:10px;white-space:nowrap}\n  .overview-grid{margin:8px 0 10px;gap:10px}\n  .welcome-panel{padding:16px 14px 14px}\n  .welcome-panel h1{font-size:clamp(32px,9.5vw,42px)}\n  .welcome-panel p{font-size:14px;line-height:1.45}\n  .onboard-pills{margin-top:12px;gap:6px}\n  .visual-panel{padding:8px}\n  .visual-stage{aspect-ratio:4/3}\n  .steps{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-bottom:10px}\n  .step{padding:8px 10px;gap:8px;font-size:12px}\n  .step b{width:28px;height:28px;border-radius:9px;font-size:11px}\n}\n'''
          if '/* RC45 portrait compactness + copy cleanup */' not in s:
              s=s.replace('</style>',css+'\n</style>',1)
          p.write_text(s)

          p=Path('sw.js')
          s=p.read_text()
          anchor="'./assets/k2e-local-home-visual-locked-dark.webp','./assets/k2e-local-home-visual-locked-light.webp'"
          live=anchor+",'./assets/k2e-local-home-visual-live-dark.png','./assets/k2e-local-home-visual-live-light.png'"
          if 'k2e-local-home-visual-live-dark.png' not in s and anchor in s:
              s=s.replace(anchor,live,1)
          s=s.replace("const CACHE_NAME = 'k2e-local-v2.0.0-rc.45';", "const CACHE_NAME = 'k2e-local-v2.0.0-rc.45-art5';")
          p.write_text(s)
          PY

      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .artfix
          rm -f .github/workflows/repair-artwork-render.yml
          node scripts/validate-release.mjs
          node scripts/validate-full-wiring.mjs
          find . -type f ! -name 'SHA256SUMS.txt' ! -path './.git/*' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          git config user.name 'scar197124'
          git config user.email 'spartica1791@gmail.com'
          git add -A
          git commit -m 'Apply restored artwork and compact portrait flow'
          git push origin HEAD:main
