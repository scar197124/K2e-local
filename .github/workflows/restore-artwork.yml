name: Restore approved K2E artwork

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: ${{ !contains(github.event.head_commit.message, 'Restore approved artwork and rebalance hero') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore artwork and rebalance desktop/mobile framing
        shell: bash
        run: |
          set -euo pipefail
          cat .artwork-payload/dark.*.b64 | base64 -d > assets/k2e-local-home-visual-restored.webp
          test "$(wc -c < assets/k2e-local-home-visual-restored.webp)" -eq 54068
          file assets/k2e-local-home-visual-restored.webp | grep -qi 'Web/P\|WebP'
          python - <<'PY'
          from pathlib import Path

          # Public landing: restore actual artwork bytes and bring the desktop hero
          # back toward the approved, less oversized framing.
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('k2e-local-home-visual-locked-dark.webp','k2e-local-home-visual-restored.webp')
          s=s.replace('k2e-local-home-visual-locked-light.webp','k2e-local-home-visual-restored.webp')
          s=s.replace('grid-template-columns:minmax(0,.92fr) minmax(560px,1.2fr);min-height:700px','grid-template-columns:minmax(0,.86fr) minmax(540px,1.14fr);min-height:610px')
          s=s.replace('padding:48px 28px 48px 30px','padding:40px 28px 40px 30px')
          s=s.replace('.hero-visual{position:relative;min-height:700px;','.hero-visual{position:relative;min-height:610px;')
          s=s.replace('.hero-visual{min-height:500px;background-size:contain;background-position:center center}', '.hero-visual{min-height:0;aspect-ratio:728/710;background-size:contain;background-position:center center}')
          s=s.replace('.hero-visual{min-height:390px;background-size:contain;background-position:center center}', '.hero-visual{min-height:0;aspect-ratio:728/710;background-size:contain;background-position:center center}')
          s=s.replace("[data-theme=\"light\"] .hero-visual{background-color:#eef6fb;background-image:url('./assets/k2e-local-home-visual-restored.webp');background-size:contain;background-position:center center}", "[data-theme=\"light\"] .hero-visual{background-color:#eef6fb;background-image:url('./assets/k2e-local-home-visual-restored.webp');background-size:contain;background-position:center center;filter:brightness(1.08) saturate(.96)}")
          p.write_text(s)

          # Internal app: the second blank panel was the same broken asset.
          p=Path('app.html')
          s=p.read_text()
          s=s.replace('k2e-local-home-visual-locked-dark.webp','k2e-local-home-visual-restored.webp')
          s=s.replace('k2e-local-home-visual-locked-light.webp','k2e-local-home-visual-restored.webp')
          s=s.replace('.visual-panel{padding:14px;display:grid;grid-template-rows:minmax(280px,1fr) auto;gap:12px}', '.visual-panel{padding:14px;display:grid;grid-template-rows:auto auto;gap:12px}')
          s=s.replace('.visual-stage{min-height:280px;', '.visual-stage{min-height:0;aspect-ratio:728/710;')
          s=s.replace("[data-theme=\"light\"] .visual-stage{background-color:#eef6fb;background-image:url('./assets/k2e-local-home-visual-restored.webp')}", "[data-theme=\"light\"] .visual-stage{background-color:#eef6fb;background-image:url('./assets/k2e-local-home-visual-restored.webp');filter:brightness(1.08) saturate(.96)}")
          p.write_text(s)

          # New filename avoids stale service-worker/browser copies of the broken WebP.
          p=Path('sw.js')
          s=p.read_text()
          s=s.replace("'./assets/k2e-local-home-visual-locked-dark.webp','./assets/k2e-local-home-visual-locked-light.webp'", "'./assets/k2e-local-home-visual-restored.webp'")
          p.write_text(s)
          PY
          grep -q 'k2e-local-home-visual-restored.webp' index.html
          grep -q 'k2e-local-home-visual-restored.webp' app.html
          grep -q 'k2e-local-home-visual-restored.webp' sw.js
          ! grep -q 'home-visual-locked-dark.webp' index.html
          ! grep -q 'home-visual-locked-dark.webp' app.html
          node scripts/validate-release.mjs
          node scripts/validate-full-wiring.mjs
          rm -rf .artwork-payload
          rm -f .github/workflows/restore-artwork.yml
          find . -type f ! -name 'SHA256SUMS.txt' ! -path './.git/*' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Commit restored artwork
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "scar197124"
          git config user.email "spartica1791@gmail.com"
          git add -A
          git commit -m "Restore approved artwork and rebalance hero"
          git push origin HEAD:main
