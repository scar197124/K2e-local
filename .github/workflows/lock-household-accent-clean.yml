name: Locked accent clean release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.event.head_commit.message == 'Run locked accent clean release' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply locked accent
        run: python3 .release/lock_accent.py
      - name: Clean repository
        shell: bash
        run: |
          set -euo pipefail
          rm -f BRAND_MIGRATION.md CURRENT_MAIN_COMMIT.txt GITHUB_SOCIAL_PREVIEW_UPLOAD.png REVIEW_BUILD_NOTES.txt SOCIAL_PREVIEW_SETUP.md UPLOAD_TO_GITHUB.txt
          rm -f K2E_LOCAL_*_FIX.md RELEASE_NOTES_v*.md
          rm -rf assets/archive .artfix .release
          rm -f assets/k2e-brand-identity-board.png assets/k2e-local-brand-dark.png assets/k2e-local-brand-detailed.png assets/k2e-local-brand-light.png assets/k2e-local-logo-magic.png assets/k2e-local-mark.png assets/k2e-local-readme-banner.jpg
          rm -f assets/k2e-local-social-preview-v1.13.0.png assets/k2e-local-social-preview-v1.13.1.png assets/k2e-local-social-preview-v1.14.0.png assets/k2e-local-social-preview-v1.14.1.png
          rm -f assets/k2e-local-home-visual-locked-dark.webp assets/k2e-local-home-visual-locked-light.webp assets/k2e-local-home-visual-restored.webp
          find docs/releases -maxdepth 1 -type f ! -name 'RELEASE_NOTES_v2.0.0-rc.45.md' -delete
          rm -f .github/workflows/lock-household-accent-clean.yml
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-release.mjs
          node scripts/validate-full-wiring.mjs
          find . -type f ! -name SHA256SUMS.txt ! -path './.git/*' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Commit clean locked release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name scar197124
          git config user.email spartica1791@gmail.com
          git add -A
          git commit -m 'Lock RC45 household accents and clean repository'
          git push origin HEAD:main
